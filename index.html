<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yoonsik Trend Party</title>
    <meta name="description" content="Tham gia party để rinh quà về ngay nào!" />
    <link rel="icon" href="/.netlify/images?url=/img/cover.png&w=64&fm=png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="min-h-screen font-sans text-slate-800">
    <div class="max-w-2xl mx-auto px-4 py-8 sm:py-12">
      <!-- Cover -->
      <header class="bg-white rounded-3xl shadow-xl shadow-sky-200/60 overflow-hidden mb-8 border border-sky-100 text-center p-6 sm:p-8">
        <div class="w-48 h-48 mx-auto mb-5 rounded-full bg-sky-50 overflow-hidden border-4 border-sky-200 shadow-inner animate-float">
          <img
            src="/.netlify/images?url=/img/cover.png&w=384&fm=webp"
            alt="Yoonsik Trend Party"
            width="192"
            height="192"
            class="w-full h-full object-cover"
          />
        </div>
        <h1 class="text-3xl sm:text-4xl font-extrabold text-sky-700 mb-2 tracking-tight">Yoonsik Trend Party</h1>
        <p class="text-slate-500 mb-6 text-sm">Tham gia party để rinh quà về ngay nào!</p>

        <button id="openModalBtn" type="button" class="btn-babyblue font-semibold px-8 py-3 rounded-full shadow-md shadow-sky-300/50 transition transform hover:scale-105">
          Đăng ký tham gia
        </button>

        <div class="mt-6 grid grid-cols-3 gap-3 text-xs">
          <div class="rounded-2xl bg-sky-50 py-3">
            <div id="statJoined" class="text-lg font-bold text-sky-700">–</div>
            <div class="text-slate-500">Đã tham gia</div>
          </div>
          <div class="rounded-2xl bg-sky-50 py-3">
            <div id="statLeft" class="text-lg font-bold text-sky-700">–</div>
            <div class="text-slate-500">Số còn trống</div>
          </div>
          <div class="rounded-2xl bg-sky-50 py-3">
            <div class="text-lg font-bold text-sky-700">100–500</div>
            <div class="text-slate-500">Khoảng số GA</div>
          </div>
        </div>
      </header>

      <!-- Participant list -->
      <section class="bg-white rounded-3xl shadow-xl shadow-sky-200/60 p-6 border border-sky-100">
        <h2 class="text-xl font-bold text-sky-700 mb-4 flex items-center justify-between gap-3">
          <span>Danh sách tham gia</span>
          <span id="totalCount" class="text-xs bg-sky-100 text-sky-700 px-3 py-1 rounded-full whitespace-nowrap">0 người</span>
        </h2>

        <input
          id="search"
          type="search"
          placeholder="Tìm theo tên hoặc số GA…"
          class="w-full mb-4 px-4 py-2.5 rounded-xl border border-sky-200 focus:ring-2 focus:ring-sky-400 focus:outline-none text-sm"
        />

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-sky-100 text-sky-700 text-sm">
                <th class="py-3 px-4 font-semibold w-16">STT</th>
                <th class="py-3 px-4 font-semibold">Tên</th>
                <th class="py-3 px-4 font-semibold text-right">Số GA</th>
              </tr>
            </thead>
            <tbody id="participantTable" class="divide-y divide-slate-100 text-sm">
              <tr><td colspan="3" class="text-center py-6 text-slate-400">Đang tải danh sách...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <footer class="text-center text-xs text-sky-700/60 mt-8">Made with 💙 for Yoonsik</footer>
    </div>

    <!-- Registration modal -->
    <div id="registerModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-sky-100 relative animate-pop-in">
        <h3 id="modalTitle" class="text-xl font-bold text-sky-700 mb-4 text-center">Đăng Ký Tham Gia GA</h3>

        <form id="registerForm" class="space-y-4" novalidate>
          <div>
            <label for="name" class="block text-xs font-semibold text-slate-600 mb-1">Tên người chơi (Công khai)</label>
            <input type="text" id="name" name="name" maxlength="60" required class="w-full px-4 py-2.5 rounded-xl border border-sky-200 focus:ring-2 focus:ring-sky-400 focus:outline-none text-sm" />
          </div>

          <div>
            <label for="twitter" class="block text-xs font-semibold text-slate-600 mb-1">Link tài khoản X (Bảo mật – không hiển thị công khai)</label>
            <input type="url" id="twitter" name="twitter" placeholder="https://x.com/username" required class="w-full px-4 py-2.5 rounded-xl border border-sky-200 focus:ring-2 focus:ring-sky-400 focus:outline-none text-sm" />
          </div>

          <div>
            <label for="instagram" class="block text-xs font-semibold text-slate-600 mb-1">Link tài khoản IG (Bảo mật – không hiển thị công khai)</label>
            <input type="url" id="instagram" name="instagram" placeholder="https://instagram.com/username" required class="w-full px-4 py-2.5 rounded-xl border border-sky-200 focus:ring-2 focus:ring-sky-400 focus:outline-none text-sm" />
          </div>

          <div>
            <label for="gaNumber" class="block text-xs font-semibold text-slate-600 mb-1">Nhập số tham gia GA (100 - 500, không trùng)</label>
            <div class="flex gap-2">
              <input type="number" id="gaNumber" name="gaNumber" min="100" max="500" required class="flex-1 min-w-0 px-4 py-2.5 rounded-xl border border-sky-200 focus:ring-2 focus:ring-sky-400 focus:outline-none text-sm" />
              <button type="button" id="randomBtn" class="px-3 rounded-xl bg-sky-50 hover:bg-sky-100 text-sky-700 text-xs font-semibold transition whitespace-nowrap" title="Chọn ngẫu nhiên một số còn trống">🎲 Ngẫu nhiên</button>
            </div>
            <p id="gaHint" class="mt-1 text-xs min-h-4"></p>
          </div>

          <p id="formError" class="hidden text-xs text-red-500 bg-red-50 rounded-xl px-3 py-2"></p>

          <div class="flex space-x-3 pt-2">
            <button type="button" id="cancelBtn" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-2.5 rounded-xl transition text-sm">Hủy</button>
            <button type="submit" id="submitBtn" class="w-1/2 btn-babyblue font-semibold py-2.5 rounded-xl transition text-sm shadow-md">Gửi thông tin</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 hidden bg-sky-700 text-white text-sm font-semibold px-5 py-3 rounded-full shadow-lg z-[60] animate-pop-in"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
